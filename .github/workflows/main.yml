name: Deploy BE & FE to EC2

on:
  push:
    branches: ["main", "develop"]   # main, develop 브랜치 push 시 자동 배포
  workflow_dispatch: {}              # 수동 실행 버튼

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build → copy JAR → docker restart on EC2
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cosmeticShop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew || true

      - name: Build jar
        run: ./gradlew -x test clean bootJar

      # EC2 ubuntu 홈에 임시 업로드 폴더 생성
      - name: Prepare dirs on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: mkdir -p /home/ubuntu/deploy/build/libs

      # 빌드된 JAR 업로드 (ubuntu 계정 홈 기준)
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "cosmeticShop/build/libs/*.jar"   # ✅ 정확한 상대경로
          target: "/home/ubuntu/deploy/build/libs/"

      # 도커 이미지 빌드 및 재기동 (root 권한으로 실행)
      - name: Build & restart container on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            sudo bash -lc '
              set -e
              mkdir -p /home/ubuntu/cosmeticShop/cosmeticShop/build/libs
              mv /home/ubuntu/deploy/build/libs/*.jar /home/ubuntu/cosmeticShop/cosmeticShop/build/libs/ || true
              cd /home/ubuntu/cosmeticShop/cosmeticShop
              docker image prune -af || true
              docker build -t cosmeticshop:latest .
              docker rm -f cosmeticshop || true
              docker run -d --name cosmeticshop \
                -p 9000:9000 \
                --env-file ${{ secrets.EC2_ENV_FILE_PATH }} \
                --restart unless-stopped \
                cosmeticshop:latest
            '
            sleep 3
            curl -sfI http://127.0.0.1:9000/ | head -n 1 || true

  frontend:
    name: Frontend build → upload dist → replace on EC2
    runs-on: ubuntu-latest
    needs: backend

    defaults:
      run:
        working-directory: cosmeticShop/src/main/frontend/cosmetic-shop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cosmeticShop/src/main/frontend/cosmetic-shop/package-lock.json

      - name: Write .env.production
        run: printf "VITE_API_BASE=/api\n" > .env.production

      - name: Install deps & build
        run: |
          npm ci
          npm run build
          tar -C dist -czf dist.tar.gz .

      - name: Upload dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "cosmeticShop/src/main/frontend/cosmetic-shop/dist.tar.gz"
          target: "/tmp/dist.tar.gz"

      - name: Replace /var/www/cosmeticshop on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            sudo bash -lc '
              set -e
              DIST=$(find /tmp -type f -name dist.tar.gz -printf "%T@ %p\n" | sort -nr | head -n1 | awk "{print \$2}")
              if [ -z "$DIST" ]; then
                echo "dist.tar.gz not found under /tmp" >&2
                exit 1
              fi
              echo "Using: $DIST"
              mkdir -p /var/www/cosmeticshop
              rm -rf /var/www/cosmeticshop/*
              tar -xzf "$DIST" -C /var/www/cosmeticshop
              find /var/www/cosmeticshop -type d -exec chmod 755 {} \;
              find /var/www/cosmeticshop -type f -exec chmod 644 {} \;
              if command -v nginx >/dev/null 2>&1; then
                nginx -t && systemctl reload nginx || true
              fi
            '
            curl -sfI http://127.0.0.1/ | head -n 1 || true
