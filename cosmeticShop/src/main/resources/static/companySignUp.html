<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>기업 회원가입</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
<div class="bg-white p-8 rounded shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center">기업 회원가입</h2>
    <form id="signupForm" class="space-y-4">
        
        <input id="userId"     type="text"   placeholder="아이디"         class="w-full border p-2" required>
        <input id="password"   type="password" placeholder="비밀번호"       class="w-full border p-2" required>
        <input id="companyName"  type="companyName"  placeholder="기업명"         class="w-full border p-2" required>
        <input id="email"      type="email"  placeholder="대표자 이메일"         class="w-full border p-2" required>
        <input id="phoneNumber"   type="phoneNumber"  placeholder="대표전화"         class="w-full border p-2" required>
        
        <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded">가입하기</button>
    </form>
    <p class="mt-4 text-center text-sm text-gray-500">
        이미 계정이 있으신가요? <a href="companyLogin.html" class="text-blue-600">로그인</a>
    </p>
</div>
<script src="js/pages/companySignUp.js"></script>
</body>
</html>
