server:
  port: 9000
  servlet:
    session:
      cookie:
        same-site: None

spring:
  config:
    import:
      - optional:file:.env[.properties]               # 로컬 실행용
      - optional:file:/home/ubuntu/.env[.properties]  # EC2 서버용

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/

  mail:
    host: localhost

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true

jwt:
  secretKey: ${JWT_SECRETKEY}
  refreshExpirationMs: ${JWT_REFRESHEXPIRATIONMS:604800000}

iamport:
  api:
    key: dummy-key
    secret: dummy-secret

logging:
  level:
    org.springframework.security: DEBUG

app:
  storage: ${STORAGE_MODE:local}  # local, supabase, s3
  upload-dir: "C:/Users/admin/Desktop/cosmeticShop/cosmeticShop/src/main/resources/static/images"

supabase:
  url: ${SUPABASE_URL:}
  service-key: ${SUPABASE_SERVICE_KEY:}
  bucket: cosmall_image

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
