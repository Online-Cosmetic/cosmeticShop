<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
    <h1 class="text-2xl font-bold mb-6 text-center">CosmeticShop 로그인</h1>
    <form id="loginForm" class="space-y-4">
        
        <div>
            <label class="block mb-1 font-medium" for="userId">아이디</label>
            <input id="userId" type="text" required
                   class="w-full border rounded p-2" placeholder="userId 입력" />
        </div>
        <div>
            <label class="block mb-1 font-medium" for="password">비밀번호</label>
            <input id="password" type="password" required
                   class="w-full border rounded p-2" placeholder="password 입력" />
        </div>
        <button type="submit"
                class="w-full bg-blue-500 text-white rounded p-2 hover:bg-blue-600">
            로그인
        </button>
    </form>
    <p class="mt-4 text-center text-sm">
        계정이 없으신가요?
        <a href="userSignUp.html" class="text-blue-500 hover:underline">회원가입</a>
    </p>
</div>

<script src="js/pages/userLogin.js"></script>
</body>
</html>
