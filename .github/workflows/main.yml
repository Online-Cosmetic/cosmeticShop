name: Deploy BE & FE to EC2

on:
  push:
    branches: ["main", "develop"]   # 둘 다에서 자동 배포
  workflow_dispatch: {}              # 수동 실행 버튼

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build -> copy JAR -> docker restart on EC2
    runs-on: ubuntu-latest

    # Gradle이 있는 하위 폴더에서 실행
    defaults:
      run:
        working-directory: cosmeticShop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable (safety)
        run: chmod +x ./gradlew || true

      - name: Build jar
        run: ./gradlew -x test clean bootJar

      # ubuntu 홈에 임시 업로드 경로 생성 (권한 문제 방지)
      - name: Prepare dirs on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}   # ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            mkdir -p /home/ubuntu/deploy/build/libs

      # 빌드된 JAR을 ubuntu 홈으로 업로드
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}   # ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "cosmeticShop/build/libs/*.jar"   # 레포 루트 기준
          target: "/home/ubuntu/deploy/build/libs/"

      # sudo로 루트 경로에 반영 + 도커 재기동
      - name: Build & restart container on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}   # ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            sudo bash -lc '
              set -e
              mkdir -p /root/cosmeticShop/cosmeticShop/build/libs
              mv /home/ubuntu/deploy/build/libs/*.jar /root/cosmeticShop/cosmeticShop/build/libs/ || true
              cd /root/cosmeticShop/cosmeticShop
              docker image prune -af || true
              docker build -t cosmeticshop:latest .
              docker rm -f cosmeticshop || true
              docker run -d --name cosmeticshop \
                -p 9000:9000 \
                --env-file ${{ secrets.EC2_ENV_FILE_PATH }} \
                --restart unless-stopped \
                cosmeticshop:latest
            '
            sleep 2
            curl -sfI http://127.0.0.1:9000/ | head -n 1 || true

  frontend:
    name: Frontend build -> upload dist -> replace on EC2
    runs-on: ubuntu-latest
    needs: backend

    defaults:
      run:
        working-directory: cosmeticShop/src/main/frontend/cosmetic-shop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cosmeticShop/src/main/frontend/cosmetic-shop/package-lock.json

      - name: Write .env.production
        run: printf "VITE_API_BASE=/api\n" > .env.production

      - name: Install deps & build
        run: |
          npm ci
          npm run build
          tar -C dist -czf dist.tar.gz .

      - name: Upload dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}   # ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "cosmeticShop/src/main/frontend/cosmetic-shop/dist.tar.gz"
          target: "/tmp/"

      - name: Replace /var/www/cosmeticshop on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}   # ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            sudo bash -lc '
              set -e
              mkdir -p /var/www/cosmeticshop
              rm -rf /var/www/cosmeticshop/*
              tar -xzf /tmp/dist.tar.gz -C /var/www/cosmeticshop
              if command -v nginx >/dev/null 2>&1; then
                nginx -t && systemctl reload nginx || true
              fi
            '
            curl -sfI http://127.0.0.1/ | head -n 1 || true
