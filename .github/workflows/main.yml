name: Deploy BE & FE to EC2

on:
  push:
    branches: ["main", "develop"]   # main, develop 브랜치 push 시 자동 배포
  workflow_dispatch: {}              # 수동 실행 버튼

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build → copy JAR → docker restart on EC2
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cosmeticShop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew || true

      - name: Build jar
        run: ./gradlew -x test clean bootJar

      # EC2 ubuntu 홈에 임시 업로드 폴더 생성
      - name: Prepare dirs on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: mkdir -p /home/ubuntu/deploy/build/libs

      # 빌드된 JAR 업로드 (ubuntu 계정 홈 기준)
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "cosmeticShop/build/libs/*.jar"
          target: "/home/ubuntu/deploy/build/libs/"
          strip_components: 3   # cosmeticShop/build/libs/ 제거하고 파일만 두기

      # 도커 이미지 빌드 및 재기동 (root 권한으로 실행)
      - name: Build & restart container on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            sudo bash -lc '
              set -e
              mkdir -p /home/ubuntu/cosmeticShop/cosmeticShop/build/libs

              # JAR 존재 확인 (없으면 실패)
              ls -l /home/ubuntu/deploy/build/libs/*.jar

              # JAR 배치
              mv -f /home/ubuntu/deploy/build/libs/*.jar /home/ubuntu/cosmeticShop/cosmeticShop/build/libs/

              cd /home/ubuntu/cosmeticShop/cosmeticShop

              docker rm -f cosmeticshop || true
              docker build -t cosmeticshop:latest .

              # ENV 파일 확인 (ubuntu 홈)
              test -f /home/ubuntu/.env || { echo ".env not found"; exit 1; }

              # .env를 컨테이너에 주입
              docker run -d --name cosmeticshop \
                -p 9000:9000 \
                --env-file /home/ubuntu/.env \
                --restart unless-stopped \
                cosmeticshop:latest

              # 헬스체크
              sleep 3
              echo "---- docker ps ----"
              docker ps
              echo "---- curl BE ----"
              curl -sfI http://127.0.0.1:9000/ | head -n 1 || true
            '

  frontend:
    name: Frontend build → upload dist → replace on EC2
    runs-on: ubuntu-latest
    needs: backend

    defaults:
      run:
        working-directory: cosmeticShop/src/main/frontend/cosmetic-shop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cosmeticShop/src/main/frontend/cosmetic-shop/package-lock.json

      #  도메인 하드코딩 대신 Nginx 프록시(/api) 사용
      - name: Write .env.production
        run: |
          printf "VITE_API_BASE=/api\n" > .env.production
          printf "VITE_BACKEND_URL=/api\n" >> .env.production
          printf "VITE_IMAGE_BASE_URL=/images\n" >> .env.production

      - name: Install deps & build
        run: |
          npm ci
          npm run build
          tar -czf dist.tar.gz -C dist .
          ls -lh dist.tar.gz

      #  단순하게 /tmp 로 업로드 (strip_components 사용 X)
      - name: Upload dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "cosmeticShop/src/main/frontend/cosmetic-shop/dist.tar.gz"
          target: "/tmp/"
          overwrite: true
          strip_components: 5

      #  /var/www/cosmeticshop 에 바로 배포 (Nginx root와 일치)
      - name: Deploy frontend to /var/www/cosmeticshop on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            sudo bash -lc '
              set -e
              echo "=== Unpacking Frontend ==="
              test -f /tmp/dist.tar.gz || { echo "dist.tar.gz not found under /tmp"; exit 1; }

              mkdir -p /var/www/cosmeticshop
              rm -rf /var/www/cosmeticshop/*
              tar -xzf /tmp/dist.tar.gz -C /var/www/cosmeticshop

              chown -R www-data:www-data /var/www/cosmeticshop
              chmod -R 755 /var/www/cosmeticshop

              echo "=== Restarting Nginx ==="
              nginx -t && systemctl restart nginx
            '
